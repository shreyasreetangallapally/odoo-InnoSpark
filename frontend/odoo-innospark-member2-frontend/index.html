<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Inventory Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div><strong>StockSense</strong><span>Inventory Control</span></div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">⌂ <span>Dashboard</span></button>
        <button class="nav-item" data-view="products">▦ <span>Products</span></button>
        <button class="nav-item" data-view="receipts">↓ <span>Receipts</span></button>
        <button class="nav-item" data-view="deliveries">↑ <span>Deliveries</span></button>
        <button class="nav-item" data-view="transfers">⇄ <span>Transfers</span></button>
        <button class="nav-item" data-view="adjustments">± <span>Adjustments</span></button>
        <button class="nav-item" data-view="ledger">☷ <span>Stock Ledger</span></button>
        <button class="nav-item" data-view="search">⌕ <span>Where is a product?</span></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="notifications">🔔 <span>Notifications <b class="badge">3</b></span></button>
        <div class="user-card">
          <div class="avatar">AD</div>
          <div><strong>Admin</strong><span>OWNER</span></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">WAREHOUSE OPERATIONS</p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="top-actions">
          <div class="api-dot" id="api-status"><i></i> Demo data</div>
          <button class="icon-btn" data-view="notifications">🔔<span class="dot"></span></button>
          <div class="top-avatar">AD</div>
        </div>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
